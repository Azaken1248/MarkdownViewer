name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushing twice in a minute used to run two full pipelines against the same
# branch, and the older one's result was never the one anybody wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here is granted that is not used. The default is whatever the
# repository is set to, which is a setting somewhere else rather than a fact
# about this file.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite has its own 300s ceiling per suite and takes about 90s in
    # total, so this is only here to stop a hung run burning the six-hour
    # default before anybody notices.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 20 is what this is developed against; 22 catches anything that will
        # break on the next LTS before it becomes urgent.
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the two have drifted.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # The types are the JSDoc already in the source, checked by tsc with
      # checkJs — no TypeScript, no build, and the file in the browser is still
      # the file in the repository. It runs here because the shapes it checks
      # (the diagram model, the stores, req.auth) cross five modules each, and
      # a field added in one and forgotten in another is otherwise caught only
      # if some test happens to walk that path.
      - name: Type check
        run: npm run typecheck

      # After lint, not before, so an advisory in a dependency cannot mask a
      # mistake in the code. High and critical fail the build; moderate and low
      # show in the log and in Dependabot's queue without stopping work.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # ...and the seven libraries npm audit cannot see, because they are
      # <script> tags rather than entries in package.json. SRI pins their
      # bytes, which stops a compromised CDN and does nothing about a
      # vulnerability in the library itself — and the library doing the most
      # security-relevant work here is the HTML sanitizer. The threshold is
      # moderate rather than high: this is eight packages, all of them running
      # in a reader's browser over somebody else's document, so the noise is
      # bounded and the blast radius is not.
      - name: Audit the libraries loaded from a CDN
        run: npm run audit:cdn

      # Optional at runtime — with no build the pages serve the scripts they
      # name — but built here so the bundles are what the suite compares
      # against, and so a change that breaks the build fails now rather than
      # on somebody's deploy.
      - name: Build
        run: npm run build

      # The DOM suite spawns its own server against a temp state directory, so
      # there is nothing to start here and nothing to clean up.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      # A failing run used to say "Process completed with exit code 1" and
      # nothing else to anyone without permission to download the log, which
      # is a failure you cannot work on.
      #
      # The job summary is not readable through the API, and the log needs
      # permission on the repository — but an annotation is public with the
      # run. So each failing check becomes one, and the summary keeps the
      # surrounding output for anyone reading the run in a browser.
      - name: Say which checks failed
        if: failure()
        run: |
          grep -E '^[[:space:]]+FAIL|suite\(s\) FAILED|was cut off' /tmp/test.log \
            | head -40 \
            | while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r')"
              done
          {
            echo '### Failing checks'
            echo
            echo '```'
            grep -E '^[[:space:]]+FAIL|suite\(s\) FAILED|was cut off' /tmp/test.log \
              | head -60 || true
            echo '```'
            echo
            echo '<details><summary>The last 120 lines</summary>'
            echo
            echo '```'
            tail -120 /tmp/test.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # NODE_ENV=production, which is the mode the deployment runs in and was
      # the one mode nothing ever started: Express renders errors and caches
      # views differently under it, so booting without it checked a
      # configuration nobody deploys.
      #
      # `npm run build` ran above, so the pages serve bundles here — which is
      # also what a deployment does, and means the smoke check below is
      # looking at the same assets.
      - name: Boot as production and check what it serves
        run: |
          MDVIEWER_STATE_DIR="$(mktemp -d)" \
          NODE_ENV=production \
          PORT=4321 \
          PUBLIC_BASE_URL=http://127.0.0.1:4321 \
          LOG_REQUESTS=false \
          node server.js &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4321/healthz > /dev/null && break
            if [ "$i" = 40 ]; then
              echo "::error::The server never became healthy"
              exit 1
            fi
            sleep 0.5
          done

          # Every asset the pages name, fetched at the stamped address it is
          # named at. A page whose scripts 404 loads and then does nothing,
          # which no health check can see.
          node tools/smoke.js http://127.0.0.1:4321

  # The same suite once more, under c8, for the map of what it never reaches.
  # Its own job so the run above keeps its timings — instrumentation slows the
  # pointer-gesture suites — and so a report is never the reason a build is
  # red: there is no threshold, on purpose. The value is the list of unreached
  # branches, not the percentage, and a percentage that must go up is a
  # percentage people write tests to raise rather than tests that find things.
  coverage:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test under c8
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee /tmp/coverage.log

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo 'A map, not a target: the files the suite never reaches are the'
            echo 'places confidence exceeds evidence. The full report is the'
            echo '`coverage-report` artifact on this run.'
            echo
            echo '```'
            sed -n '/^=* Coverage summary/,/^=*$/p' /tmp/coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
