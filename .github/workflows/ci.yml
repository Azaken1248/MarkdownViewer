name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is what this is developed against; 22 catches anything that will
        # break on the next LTS before it becomes urgent.
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the two have drifted.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # The types are the JSDoc already in the source, checked by tsc with
      # checkJs — no TypeScript, no build, and the file in the browser is still
      # the file in the repository. It runs here because the shapes it checks
      # (the diagram model, the stores, req.auth) cross five modules each, and
      # a field added in one and forgotten in another is otherwise caught only
      # if some test happens to walk that path.
      - name: Type check
        run: npm run typecheck

      # After lint, not before, so an advisory in a dependency cannot mask a
      # mistake in the code. High and critical fail the build; moderate and low
      # show in the log and in Dependabot's queue without stopping work.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Optional at runtime — with no build the pages serve the scripts they
      # name — but built here so the bundles are what the suite compares
      # against, and so a change that breaks the build fails now rather than
      # on somebody's deploy.
      - name: Build
        run: npm run build

      # The DOM suite spawns its own server against a temp state directory, so
      # there is nothing to start here and nothing to clean up.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      # A failing run used to say "Process completed with exit code 1" and
      # nothing else to anyone without permission to download the log, which
      # is a failure you cannot work on.
      #
      # The job summary is not readable through the API, and the log needs
      # permission on the repository — but an annotation is public with the
      # run. So each failing check becomes one, and the summary keeps the
      # surrounding output for anyone reading the run in a browser.
      - name: Say which checks failed
        if: failure()
        run: |
          grep -E '^[[:space:]]+FAIL|suite\(s\) FAILED|was cut off' /tmp/test.log \
            | head -40 \
            | while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r')"
              done
          {
            echo '### Failing checks'
            echo
            echo '```'
            grep -E '^[[:space:]]+FAIL|suite\(s\) FAILED|was cut off' /tmp/test.log \
              | head -60 || true
            echo '```'
            echo
            echo '<details><summary>The last 120 lines</summary>'
            echo
            echo '```'
            tail -120 /tmp/test.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the server boots and reports healthy
        run: |
          MDVIEWER_STATE_DIR="$(mktemp -d)" \
          PORT=4321 \
          LOG_REQUESTS=false \
          node server.js &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4321/healthz > /dev/null; then
              curl -s http://127.0.0.1:4321/healthz
              echo
              exit 0
            fi
            sleep 0.5
          done
          echo "Server never became healthy"
          exit 1

  # The same suite once more, under c8, for the map of what it never reaches.
  # Its own job so the run above keeps its timings — instrumentation slows the
  # pointer-gesture suites — and so a report is never the reason a build is
  # red: there is no threshold, on purpose. The value is the list of unreached
  # branches, not the percentage, and a percentage that must go up is a
  # percentage people write tests to raise rather than tests that find things.
  coverage:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test under c8
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee /tmp/coverage.log

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo 'A map, not a target: the files the suite never reaches are the'
            echo 'places confidence exceeds evidence. The full report is the'
            echo '`coverage-report` artifact on this run.'
            echo
            echo '```'
            sed -n '/^=* Coverage summary/,/^=*$/p' /tmp/coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
