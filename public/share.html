<!-- The standalone share view.
     Deliberately its own page rather than a mode of the app: nothing here can
     reach the explorer, the editor, the search index or another document, so
     there is no route from a shared link back into the library. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>__SHARE_TITLE__</title>
<meta name="description" content="__SHARE_DESCRIPTION__" />
<meta name="theme-color" content="__SHARE_THEME_COLOR__" />
<meta name="author" content="__SHARE_AUTHOR__" />

<!-- An unguessable URL is only unguessable while it stays out of an index.
     noindex does not stop an unfurler from fetching a link someone pasted, so
     the preview below still works — it only keeps the URL out of search. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />

<link rel="canonical" href="__SHARE_URL__" />
<link rel="icon" type="image/svg+xml" href="__SHARE_FAVICON_URL__" />
<link rel="apple-touch-icon" href="__SHARE_APPLE_TOUCH_ICON_URL__" />

<!-- The preview describes the shared document, not the app. Title and summary
     are derived from the document's own content; see lib/excerpt.js. -->
<meta property="og:type" content="article" />
<meta property="og:title" content="__SHARE_OG_TITLE__" />
<meta property="og:description" content="__SHARE_DESCRIPTION__" />
<meta property="og:url" content="__SHARE_URL__" />
<meta property="og:site_name" content="__SHARE_SITE_NAME__" />
<meta property="article:modified_time" content="__SHARE_MODIFIED__" />
<!-- The app's card rather than anything from the document: a shared link is
     often the first thing someone sees of this, and the document's own
     pictures are not public. A PNG, and absolute — crawlers render no SVG and
     resolve no relative URLs. -->
<meta property="og:image" content="__SHARE_IMAGE_URL__" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="__SHARE_IMAGE_WIDTH__" />
<meta property="og:image:height" content="__SHARE_IMAGE_HEIGHT__" />
<meta property="og:image:alt" content="__SHARE_IMAGE_ALT__" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="__SHARE_OG_TITLE__" />
<meta name="twitter:description" content="__SHARE_DESCRIPTION__" />
<meta name="twitter:image" content="__SHARE_IMAGE_URL__" />
<meta name="twitter:image:alt" content="__SHARE_IMAGE_ALT__" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
  integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous"
  referrerpolicy="no-referrer" />

<!-- Absolute, not relative: this page is served from /s/<token>, so "js/..."
     would resolve to /s/js/... and 404, leaving a blank page. -->
<script src="/js/theme-boot.js?v=64"></script>
<link rel="stylesheet" href="/css/app.css?v=82" />

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
  integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"
  defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
  integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"
  defer></script>
<!-- The heavy four (Mermaid, KaTeX, highlight.js, svg-pan-zoom) are fetched by
     markdown-core.js only when a document needs them — see LAZY_LIBRARIES
     there. A shared link is usually opened by someone who has never been here
     before, with nothing warm in their cache, so this page has the most to gain
     from not sending 4MB ahead of the first paragraph. -->
<script src="/js/diagram-model.js?v=81" defer></script>
<script src="/js/diagram-draw.js?v=81" defer></script>
<script src="/js/markdown-core.js?v=79" defer></script>
<script src="/js/share.js?v=64" defer></script>

<div class="share-page">
  <header class="share-header">
    <span class="share-brand">
      <i class="ph ph-book-open-text" aria-hidden="true"></i>
      <span>AzaDocs</span>
    </span>

    <span class="share-badge">
      <i class="ph ph-link-simple" aria-hidden="true"></i>
      <span>Shared document</span>
    </span>

    <button class="icon-btn" id="shareThemeToggle" type="button" aria-label="Switch theme" title="Switch theme">
      <i class="ph ph-moon" aria-hidden="true"></i>
    </button>
  </header>

  <main class="share-main">
    <div class="share-loading" id="shareLoading">
      <i class="ph ph-circle-notch" aria-hidden="true"></i>
      <p>Loading the document…</p>
    </div>

    <section class="share-error" id="shareError" hidden>
      <i class="ph ph-link-break" aria-hidden="true"></i>
      <h1 id="shareErrorTitle">This link is not valid</h1>
      <p id="shareErrorMessage">It may have been revoked, or the document may have been deleted.</p>
    </section>

    <article class="markdown-body share-body" id="shareContent"></article>

    <footer class="share-footer" id="shareFooter" hidden>
      <p id="shareMeta"></p>
    </footer>
  </main>
</div>
