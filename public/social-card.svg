<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AzaDocs share preview</title>
  <desc id="desc">The AzaDocs name and tagline over a near-black panel, with a teal-outlined book icon.</desc>

  <!-- Colours track the app's dark theme tokens in public/css/app.css:
       --canvas #06090a, --surface #0c1214, --raised #131b1e,
       --border-strong #2e3d42, --accent #8ed9cf, --fg #dce7e5,
       --fg-muted #86a09d. Keep them in step if the palette moves. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090a" />
      <stop offset="55%" stop-color="#0a1113" />
      <stop offset="100%" stop-color="#101b1e" />
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1214" />
      <stop offset="100%" stop-color="#131b1e" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ed9cf" />
      <stop offset="100%" stop-color="#5fb8ae" />
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <circle cx="1110" cy="88" r="205" fill="#3f8d84" opacity="0.20" filter="url(#softGlow)" />
  <circle cx="205" cy="586" r="190" fill="#8ed9cf" opacity="0.10" filter="url(#softGlow)" />

  <rect x="64" y="62" width="1072" height="506" rx="30" fill="url(#panel)" stroke="#2e3d42" stroke-width="2" />

  <rect x="122" y="144" width="170" height="170" rx="34" fill="#06090a" stroke="url(#accent)" stroke-width="3" />
  <g transform="translate(153,171) scale(5.8)" fill="none" stroke="url(#accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
  </g>

  <text x="338" y="280" fill="#dce7e5" font-size="76" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AzaDocs</text>
  <text x="338" y="342" fill="#86a09d" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif">A personal markdown library.</text>

  <line x1="338" y1="385" x2="860" y2="385" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.95" />

  <text x="338" y="454" fill="#8ed9cf" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif">Markdown, notebooks, Mermaid diagrams and full-text search.</text>
</svg>
