# Where a page goes.
#
# There is no receiver here that reaches a person, and that is the one thing
# this directory cannot supply: an email account, a webhook, a phone number.
# Until one is filled in, everything in alerts.yml fires into the void — which
# is worse than no monitoring, because it looks like monitoring.
#
# Pick one and delete the rest.

route:
  receiver: nowhere
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  # A page that repeats every four hours is a page that gets muted. This is
  # for the ones that are still true tomorrow.
  repeat_interval: 24h

receivers:
  - name: nowhere
    # Deliberately empty. Alertmanager will accept this and deliver nothing.
    # Replace it with one of the below.

  # - name: nowhere
  #   email_configs:
  #     - to: you@example.com
  #       from: azadocs@example.com
  #       smarthost: smtp.example.com:587
  #       auth_username: azadocs@example.com
  #       auth_password_file: /etc/alertmanager/smtp-password

  # - name: nowhere
  #   webhook_configs:
  #     - url: https://example.com/hooks/azadocs
